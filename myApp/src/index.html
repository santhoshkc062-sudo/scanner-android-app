<!doctype html>
<!-- The board is light, so the letterbox is too. Set on the elements rather
     than in the <style> below because styles.css, generated from an older dark
     design, loads later and would paint them dark again. -->
<html lang="en" style="background:#eef1f6">
<head>
  <meta charset="utf-8">
  <title>Acceedo &mdash; Shopfloor MES &middot; from the gate to the grid</title>
  <base href="/">

  <!-- viewport-fit=cover so the letterbox runs under a notch instead of
       leaving a pale bar beside it; the zoom is locked because this is a board
       being looked at, not a page being read. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#0d3352">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- The first paint is the board's own ground. styles.css is a round trip
       away, and a flash of another colour before the board reads as a fault. -->
  <style>html,body{margin:0;height:100%;background:#eef1f6}</style>

  <!-- A TV left in the dark theme boots dark. The pre-rendered board is the
       light one, so it stays hidden until the app has switched over; app.ts
       keeps the class in step with the theme from then on. -->
  <style>html.tv-dark,html.tv-dark body{background:#0a1524!important}html.tv-dark .pl:not(.dk){visibility:hidden}</style>
  <script>try{if(localStorage.getItem('tvTheme')==='dark')document.documentElement.className+=' tv-dark'}catch(e){}</script>
</head>
<body style="background:#eef1f6">
  <app-root></app-root>
</body>
</html>
